# Publishes @zalify/sdk to npm.
#
# Version-driven: on every push to main (or manual dispatch), if
# package.json's version isn't on npm yet it's published. Releasing is just
# "bump the version, merge"; nothing happens when the version is already out.
#
# Auth is npm Trusted Publishing (OIDC), no token secret. One-time setup on
# npmjs.com (the package must already exist, so the first publish is
# manual): @zalify/sdk → Settings → Trusted Publisher → GitHub Actions,
# repository zalify/zalify-node, workflow "publish.yml". Provenance
# attestations are attached automatically.

name: npm publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC)

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - name: Publish @zalify/sdk (if the version is new)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@zalify/sdk@$V" version >/dev/null 2>&1; then
            echo "@zalify/sdk@$V already on npm, skipping"
          else
            # prepublishOnly runs typecheck, tests and build; pnpm >= 10.14 handles OIDC
            pnpm publish --access public --no-git-checks
          fi
